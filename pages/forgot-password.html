<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Reset your ITAMS password" />
    <title>ITAMS - Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body class="auth-page login-page">
    <div class="auth-bg auth-bg-primary" aria-hidden="true"></div>
    <main class="auth-shell">
      <div class="auth-split-container">
        <section class="auth-card auth-info-card" aria-labelledby="forgot-title">
          <div class="auth-info-content">
            <img src="../assets/images/logos/logo10.png" alt="ITAMS logo" class="info-logo" />
            <p class="eyebrow">Information Technology Services Department</p>
            <h1 id="forgot-title">Reset access</h1>
          </div>
        </section>

        <section class="auth-card auth-form-card" aria-label="Forgot password form section">
          <p class="subtitle">Forgot password</p>

          <form id="forgot-password-form" class="auth-form" novalidate>
            <div class="field-group">
              <label for="forgot-email">Email Address</label>
              <input id="forgot-email" name="email" type="email" autocomplete="email" placeholder="name.swu@phinmaed.com" required />
              <p class="error-message" aria-live="polite"></p>
            </div>

            <button type="submit" class="primary-button">Send reset link</button>

            <p class="auth-switch">
              <a href="../login.html">Return to login</a>
            </p>
          </form>
        </section>
      </div>
    </main>

    <script src="../js/auth/login.js"></script>
  </body>
</html>
